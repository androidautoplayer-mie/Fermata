name: Build AUTO'TQSM APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  build:
    name: Build AUTO•TQSM APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read versions from version catalog
        run: |
          ver_file=gradle/libs.versions.toml
          version() { grep -Po "(?<=$1).+" $ver_file |  sed -e 's/[= "]//g'; }
          app_version="$(version appVersionName)-$(git rev-parse --short HEAD)"
          sed -ri "s/appVersionName.+/appVersionName = \"$app_version\"/" $ver_file
          echo "APP_VERSION=$app_version" >> $GITHUB_ENV
          echo "ANDROID_NDK_VERSION=$(version ndkVersion)" >> $GITHUB_ENV

      - name: Export vars
        env:
          APP_NAME: 'AUTO•TQSM'
          APP_ID_SFX: .urgent24jam
          ARTIFACT_SFX: -urgent24jam
        run: |
          export_vars() {
            for name in "$@"; do
              local value="${!name}"
              [ -z "$value" ] && continue
              [ "$value" = "none" ] && value=""
              echo "$name=$value" >> "$GITHUB_ENV"
            done
          }
          export_vars APP_NAME APP_ID_SFX ARTIFACT_SFX

      - name: Prepare build identifiers
        env:
          BRANCH_OWNER: ${{ github.event.pull_request.head.repo.owner.login || github.repository_owner }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          [ -v APP_NAME ] && [ -v APP_ID_SFX ] && [ -v ARTIFACT_SFX ] && exit 0

          sanitize_package_segment() {
            tr '[:upper:]' '[:lower:]' <<< "$1" \
              | sed -E 's/[^a-z0-9]+/_/g; s/^_+|_+$//g; s/_+/_/g; s/^([0-9])/x\1/'
          }

          owner="$(sanitize_package_segment "$BRANCH_OWNER")"
          branch="$(sanitize_package_segment "$BRANCH_NAME")"
          sha="$(git rev-parse --short HEAD)"

          [ -v APP_NAME ] || echo "APP_NAME=Fermata Auto (${BRANCH_OWNER}-${sha})" >> "$GITHUB_ENV"
          [ -v APP_ID_SFX ] || echo "APP_ID_SFX=.${owner}" >> "$GITHUB_ENV"
          [ -v ARTIFACT_SFX ] || echo "ARTIFACT_SFX=-${owner}-${branch}" >> "$GITHUB_ENV"

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.ANDROID_NDK_VERSION }}
          key: ${{ runner.os }}-android-ndk-${{ env.ANDROID_NDK_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create keystore and local.properties
        env:
          CI_KEYSTORE: ${{ secrets.CI_KEYSTORE }}
          CI_ALIAS: ${{ secrets.CI_ALIAS }}
          CI_KEY_PWD: ${{ secrets.CI_KEY_PWD }}
          CI_KEYSTORE_PWD: ${{ secrets.CI_KEYSTORE_PWD }}
        run: |
          set -euo pipefail
          : "${CI_KEYSTORE:?Missing GitHub Actions secret CI_KEYSTORE}"
          : "${CI_ALIAS:?Missing GitHub Actions secret CI_ALIAS}"
          : "${CI_KEY_PWD:?Missing GitHub Actions secret CI_KEY_PWD}"
          : "${CI_KEYSTORE_PWD:?Missing GitHub Actions secret CI_KEYSTORE_PWD}"

          printf '%s' "$CI_KEYSTORE" | base64 --decode > keystore.jks
          test -s keystore.jks

          cat > local.properties <<EOF
          storeFile=$(pwd)/keystore.jks
          keyAlias=$CI_ALIAS
          keyPassword=$CI_KEY_PWD
          storePassword=$CI_KEYSTORE_PWD
          EOF

          test -f "$(pwd)/keystore.jks"

      - name: Build APKs
        env:
          NO_GS: true
        run: |
          out=fermata/build/outputs/apk_from_bundle/autoRelease
          mkdir -p dist/arm64 dist/arm
          echo "App name: $APP_NAME"
          echo "Package suffix: $APP_ID_SFX"
          ARGS=(--build-cache)
           [ -z "$APP_NAME" ] || ARGS+=("-PAPP_NAME=$APP_NAME")
           [ -z "$APP_ID_SFX" ] || ARGS+=("-PAPP_ID_SFX=$APP_ID_SFX")
           ./gradlew fermata:packageAutoReleaseUniversalApk -PABI=arm64-v8a "${ARGS[@]}"
          mv $out/*.apk dist/arm64/
          ./gradlew fermata:packageAutoReleaseUniversalApk -PABI=armeabi-v7a "${ARGS[@]}"
          mv $out/*.apk dist/arm/

      - name: Build non-minified diagnostic APK
        env:
          NO_GS: true
        run: |
          out=fermata/build/outputs/apk_from_bundle/autoDebug
          mkdir -p dist/diagnostic
          ARGS=(--build-cache)
          [ -z "$APP_NAME" ] || ARGS+=("-PAPP_NAME=$APP_NAME")
          [ -z "$APP_ID_SFX" ] || ARGS+=("-PAPP_ID_SFX=$APP_ID_SFX")
          ./gradlew fermata:packageAutoDebugUniversalApk -PABI=arm64-v8a "${ARGS[@]}"
          mv "$out"/*.apk dist/diagnostic/

      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-tqsm-${{ env.APP_VERSION }}${{ env.ARTIFACT_SFX }}-diagnostic-arm64
          path: dist/diagnostic/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Verify APK signature and package metadata
        run: |
          apk=$(find dist/arm64 -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk"
          apksigner_path=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$apksigner_path"
          "$apksigner_path" verify --verbose --print-certs "$apk"
          aapt_path=$(dirname "$apksigner_path")/aapt
          "$aapt_path" dump badging "$apk" | head -n 8

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-tqsm-${{ env.APP_VERSION }}${{ env.ARTIFACT_SFX }}-arm64
          path: dist/arm64/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload arm APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-tqsm-${{ env.APP_VERSION }}${{ env.ARTIFACT_SFX }}-arm
          path: dist/arm/*.apk
          retention-days: 30
          if-no-files-found: error
